name: Build Image Docker Contabilidade

on:
  push:
#    branches: 
#      - 'main'  
    tags:
      - 'v*'  

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            CACHE_DATE=${{ github.run_id }}
          tags: |
            ghcr.io/${{ github.repository }}/contabilidade:${{ github.sha }}
            ghcr.io/${{ github.repository }}/contabilidade:latest
            ${{ startsWith(github.ref, 'refs/tags/') && format('ghcr.io/{0}/contabilidade:{1}', github.repository, github.ref_name) || '' }}
